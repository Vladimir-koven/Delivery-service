services:
  db:
    image: postgres:16-alpine
    container_name: delivery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "${APP_EXTERNAL_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - delivery-network

volumes:
  postgres_data:

networks:
  delivery-network:
    driver: bridge