[project]
name = "delivery-service"
version = "0.1.0"
description = "FastAPI delivery service"
authors = [
    {name = "Владимир", email = "vova.yagubec@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.142.2,<0.143.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
]

[tool.poetry]
packages = [{ include = "delivery", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff>=0.16.10,<0.17.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "mypy>=2.4.0,<3.0.0",
    "bandit>=1.9.4,<2.0.0",
    "radon>=6.0.1,<7.0.0",
    "pre-commit>=4.6.2,<5.0.0",
]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["delivery"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
show_error_context = true
pretty = true
ignore_missing_imports = true
exclude = [
    "migrations/",
    "\\.venv/",
    "__pycache__/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_incomplete_defs = false
disallow_untyped_defs = false

# ---------- Bandit ----------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "__pycache__", "migrations"]
skips = ["B101"]